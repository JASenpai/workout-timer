<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Timer PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3182CE">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #1A202C; color: #EDF2F7; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; background: #2D3748; padding: 16px; border-radius: 12px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #63B3ED; }
    .btn { background: #3182CE; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #4A5568; }
    .btn-danger { background: #E53E3E; }
    .btn-success { background: #38A169; }
    
    .card { background: #2D3748; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    
    /* Workout Selector */
    .selector { display: flex; gap: 10px; }
    .selector button { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid #4A5568; background: #1A202C; color: #A0AEC0; font-weight: bold; cursor: pointer; }
    .selector button.active { border-color: #3182CE; background: #2b6cb033; color: #63B3ED; }

    /* Timer Display */
    .timer-display { text-align: center; font-size: 4rem; font-weight: 800; font-variant-numeric: tabular-nums; color: #63B3ED; margin: 10px 0; }
    .timer-label { text-align: center; font-size: 1.1rem; color: #A0AEC0; text-transform: uppercase; letter-spacing: 1px; }
    
    .controls { display: flex; gap: 10px; justify-content: center; }
    .controls button { flex: 1; padding: 14px; font-size: 1.1rem; }

    /* Exercise list */
    .exercise-info h2 { font-size: 1.3rem; color: #FFF; margin-bottom: 4px; }
    .exercise-info p { color: #A0AEC0; font-size: 0.95rem; line-height: 1.4; }
    .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; font-size: 0.9rem; background: #1A202C; padding: 10px; border-radius: 8px; }
    .meta-item span { color: #CBD5E0; font-weight: bold; }

    .workout-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
    .ex-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #1A202C; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
    .ex-item.current { border-color: #3182CE; background: #2b6cb022; }
    .ex-item-info { display: flex; flex-direction: column; }
    .ex-item-name { font-weight: 600; font-size: 0.95rem; }
    .ex-item-details { font-size: 0.8rem; color: #A0AEC0; }
    /* Summary Screen */
    #summaryScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1A202C; display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 1000;
      padding: 24px; text-align: center;
    }
    #summaryScreen h1 { font-size: 2.5rem; color: #63B3ED; margin-bottom: 20px; }
    #summaryScreen p { font-size: 1.2rem; color: #A0AEC0; margin-bottom: 30px; }

    /* Exercise Image placeholder */
    .ex-media { width: 100%; border-radius: 8px; margin-bottom: 8px; display: none; }
  </style>
</head>
<body>
  <div id="summaryScreen">
    <h1>Workout Done! 🎉</h1>
    <p id="summaryText">Total time: 45:00</p>
    <button class="btn" onclick="location.reload()">Back to Start</button>
  </div>

  <div class="container">
    <header>
      <h1>🏋️ Workout Timer</h1>
      <button class="btn btn-secondary" id="installBtn" style="display:none;">Install App</button>
    </header>

    <!-- Workout Selector -->
    <div class="selector">
      <button id="btnA" class="active" onclick="switchWorkout('A')">Workout A</button>
      <button id="btnB" onclick="switchWorkout('B')">Workout B</button>
    </div>

    <!-- Active Timer Card -->
    <div class="card">
      <div class="timer-label" id="timerLabel">Ready</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div style="display: flex; gap: 6px; justify-content: center; margin-bottom: 4px;">
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="setTimerPreset(30)">30s</button>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="setTimerPreset(45)">45s</button>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="setTimerPreset(60)">60s</button>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="setTimerPreset(90)">90s</button>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="adjustTime(10)">+10s</button>
      </div>
      <div class="controls">
        <button class="btn btn-success" id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="btn btn-secondary" onclick="nextStep()">Next</button>
        <button class="btn btn-danger" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <!-- Current Exercise Card -->
    <div class="card exercise-info">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="progressIndicator" style="font-size: 0.85rem; color: #A0AEC0;">Exercise 1 of 7</span>
        <span id="setIndicator" style="font-size: 0.85rem; color: #3182CE; font-weight: bold;">Set 1 / 4</span>
      </div>
      <img id="exImage" class="ex-media" src="" alt="Exercise preview">
      <h2 id="exName">Goblet Squat</h2>
      <p id="exNotes">Keep chest up; control the descent</p>
      <div class="meta-grid">
        <div class="meta-item">Muscle: <span id="exMuscle"></span></div>
        <div class="meta-item">Reps: <input type="text" id="editReps" style="background:#1A202C; color:#FFF; border:1px solid #4A5568; border-radius:4px; padding:2px 6px; width:90px; font-size:0.9rem;" onchange="updateReps(this.value)"></div>
        <div class="meta-item">Load: <span id="exLoad"></span></div>
        <div class="meta-item">Sets: 
          <button onclick="adjustSets(-1)" style="background:#4A5568; color:white; border:none; border-radius:3px; padding:1px 6px; cursor:pointer;">-</button>
          <span id="editSets" style="font-weight:bold; margin:0 4px;"></span>
          <button onclick="adjustSets(1)" style="background:#4A5568; color:white; border:none; border-radius:3px; padding:1px 6px; cursor:pointer;">+</button>
        </div>
      </div>
    </div>

    <!-- Workout Routine List -->
    <div class="card">
      <h3 style="font-size: 1rem; color: #CBD5E0; margin-bottom: 4px;">Routine Exercises</h3>
      <div class="workout-list" id="workoutList"></div>
    </div>
  </div>

  <script>
    let workouts = null;

    async function init() {
      try {
        const response = await fetch('workouts.json');
        workouts = await response.json();
        render();
      } catch (e) {
        console.error("Could not load workouts.json", e);
      }
    }

    let currentWorkoutKey = 'A';
    let currentExIndex = 0;
    let currentSet = 1;
    let isResting = false;
    let timeLeft = 0;
    let timerInterval = null;
    let isRunning = false;
    let startTime = null;
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn(`${err.name}, ${err.message}`);
      }
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
      if (navigator.vibrate) navigator.vibrate(200);
    }

    function switchWorkout(key) {
      currentWorkoutKey = key;
      currentExIndex = 0;
      currentSet = 1;
      isResting = false;
      stopTimer();
      document.getElementById('btnA').className = key === 'A' ? 'active' : '';
      document.getElementById('btnB').className = key === 'B' ? 'active' : '';
      render();
    }

    function render() {
      const exList = workouts[currentWorkoutKey];
      const ex = exList[currentExIndex];

      document.getElementById('progressIndicator').innerText = `Exercise ${currentExIndex + 1} of ${exList.length}`;
      document.getElementById('setIndicator').innerText = `Set ${currentSet} / ${ex.sets}`;
      document.getElementById('exName').innerText = ex.name;
      document.getElementById('exNotes').innerText = ex.notes;
      document.getElementById('exMuscle').innerText = ex.muscle;
      document.getElementById('editReps').value = ex.reps;
      document.getElementById('editSets').innerText = ex.sets;
      document.getElementById('exLoad').innerText = ex.load;

      const imgEl = document.getElementById('exImage');
      if (ex.image) {
        imgEl.src = ex.image;
        imgEl.style.display = 'block';
      } else {
        imgEl.style.display = 'none';
      }

      if (!isRunning) {
        document.getElementById('timerLabel').innerText = isResting ? 'Rest Period' : 'Ready / Working';
        document.getElementById('timerDisplay').innerText = formatTime(isResting ? timeLeft : 0);
      }

      // Render list
      const listEl = document.getElementById('workoutList');
      listEl.innerHTML = '';
      exList.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `ex-item ${idx === currentExIndex ? 'current' : ''}`;
        div.onclick = () => { selectExercise(idx); };
        div.innerHTML = `
          <div class="ex-item-info">
            <span class="ex-item-name">${idx + 1}. ${item.name}</span>
            <span class="ex-item-details">${item.sets} sets • ${item.reps}</span>
          </div>
          <span style="font-size: 0.8rem; color: #63B3ED;">${item.load}</span>
        `;
        listEl.appendChild(div);
      });
    }

    function adjustSets(delta) {
      const ex = workouts[currentWorkoutKey][currentExIndex];
      ex.sets = Math.max(1, ex.sets + delta);
      if (currentSet > ex.sets) currentSet = ex.sets;
      render();
    }

    function updateReps(val) {
      workouts[currentWorkoutKey][currentExIndex].reps = val;
    }

    function selectExercise(idx) {
      stopTimer();
      currentExIndex = idx;
      currentSet = 1;
      isResting = false;
      render();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (!startTime) {
        startTime = new Date();
        requestWakeLock();
      }
      if (isRunning) {
        stopTimer();
        document.getElementById('startBtn').innerText = 'Resume';
        document.getElementById('startBtn').className = 'btn btn-success';
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (!isRunning) {
        isRunning = true;
        document.getElementById('startBtn').innerText = 'Pause';
        document.getElementById('startBtn').className = 'btn btn-secondary';
        
        if (!isResting && timeLeft === 0) {
          // Starting rest after a set
          const ex = workouts[currentWorkoutKey][currentExIndex];
          timeLeft = ex.rest;
          isResting = true;
          document.getElementById('timerLabel').innerText = 'Rest Period';
        }

        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = formatTime(timeLeft);
            if (timeLeft <= 3 && timeLeft > 0) beep();
          } else {
            beep();
            stopTimer();
            // Rest finished, move to next set or exercise
            const ex = workouts[currentWorkoutKey][currentExIndex];
            if (currentSet < ex.sets) {
              currentSet++;
              isResting = false;
              document.getElementById('timerLabel').innerText = `Ready for Set ${currentSet}`;
              timeLeft = 0;
            } else {
              // Next exercise
              if (currentExIndex < workouts[currentWorkoutKey].length - 1) {
                currentExIndex++;
                currentSet = 1;
                isResting = false;
                document.getElementById('timerLabel').innerText = 'Next Exercise';
                timeLeft = 0;
              } else {
                showSummary();
              }
            }
            render();
          }
        }, 1000);
      }
    }

    function showSummary() {
      stopTimer();
      if (wakeLock) wakeLock.release();
      const endTime = new Date();
      const diff = Math.floor((endTime - startTime) / 1000);
      document.getElementById('summaryText').innerText = `Total time: ${formatTime(diff)}`;
      document.getElementById('summaryScreen').style.display = 'flex';
    }

    function stopTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('startBtn').innerText = 'Start Rest';
      document.getElementById('startBtn').className = 'btn btn-success';
    }

    function nextStep() {
      stopTimer();
      const ex = workouts[currentWorkoutKey][currentExIndex];
      if (currentSet < ex.sets) {
        currentSet++;
      } else if (currentExIndex < workouts[currentWorkoutKey].length - 1) {
        currentExIndex++;
        currentSet = 1;
      }
      isResting = false;
      timeLeft = 0;
      document.getElementById('timerLabel').innerText = 'Ready';
      render();
    }

    function resetTimer() {
      stopTimer();
      currentSet = 1;
      isResting = false;
      timeLeft = 0;
      document.getElementById('timerLabel').innerText = 'Ready';
      render();
    }

    function setTimerPreset(sec) {
      stopTimer();
      timeLeft = sec;
      isResting = true;
      document.getElementById('timerLabel').innerText = `Rest (${sec}s)`;
      document.getElementById('timerDisplay').innerText = formatTime(timeLeft);
      startTimer();
    }

    function adjustTime(sec) {
      timeLeft = Math.max(0, timeLeft + sec);
      document.getElementById('timerDisplay').innerText = formatTime(timeLeft);
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker Registered'));
    }

    // Install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('installBtn');
      installBtn.style.display = 'block';
      installBtn.onclick = () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        });
      };
    });

    init();
  </script>
</body>
</html>
